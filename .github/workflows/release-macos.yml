# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Faci3D macOS .dmg on a tag and attach it to the release
# (packaging/build-macos-app.sh, from IngeTrazo PR #64 by @felixriestra,
# wraps the onedir as Faci3D.app and the .app in a drag-to-Applications .dmg).
#
# Its own workflow so a Mac-side failure never holds up the Linux and
# Windows assets. Apple Silicon (arm64) and Intel (x86_64): a class of 60
# students had 8 Intel Macs among 12 (José Castro, UDELAR, 2026-10-05).
# Unsigned — the first launch is right-click ▸ Open, as the README says.
name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # exercise the build without a tag (artifact only)

permissions:
  contents: write           # to upload the .dmg to the release

jobs:
  dmg:
    name: .app + .dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false            # one Mac failing never holds the other
      matrix:
        include:
          - runner: macos-14        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel  # Intel; the .dmg is named by uname -m
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          grep -vE '^\s*pytest\b' requirements.txt > reqs.txt
          python -m pip install -r reqs.txt pyinstaller

      - name: Build Faci3D.app and the .dmg
        env:
          PYTHON: python
        run: packaging/build-macos-app.sh dist

      - name: The bundle finds everything it needs
        run: dist/Faci3D.app/Contents/MacOS/ingetrazo --check

      - uses: actions/upload-artifact@v4
        with:
          name: faci3d-macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "Faci3D ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber
